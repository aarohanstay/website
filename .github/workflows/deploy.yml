name: Deploy Aarohan App to Hostinger

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Enables manual "Run workflow" trigger button on GitHub!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: "npm"

      - name: Remove lock file and regenerate for Linux
        run: rm -f package-lock.json && npm install --platform=linux --arch=x64

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export (out/)
        run: npm run build

      - name: Upload Static Files to Hostinger Subdomain Folder via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.HOSTINGER_TARGET_FOLDER || 'public/' }}
          local-dir: './out/'
          dangerous-clean-slate: false
